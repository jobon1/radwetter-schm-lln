const coords=[{lat:51.043,lon:12.299},{lat:50.897,lon:12.353}];let days=[],selected=0;
function direction(a,b){const x=(b.lon-a.lon)*Math.cos((a.lat+b.lat)/2*Math.PI/180),y=b.lat-a.lat;return(Math.atan2(x,y)*180/Math.PI+360)%360}
function headwind(speed,from,travel){return Math.max(0,speed*Math.cos((from-travel)*Math.PI/180))}
const bearingA=direction(coords[0],coords[1]),bearingB=direction(coords[1],coords[0]);
const keys=['temperature_2m','precipitation_probability','precipitation','wind_speed_10m','wind_direction_10m','wind_gusts_10m'];
function sample(data,date,hour){const ix=data.hourly.time.indexOf(date+'T'+hour);if(ix<0)return null;return Object.fromEntries(keys.map(k=>[k,data.hourly[k][ix]]))}
function scoreRide(v,head){if(!v)return 0;return Math.max(0,Math.round(100-Math.min(62,v.precipitation_probability*.67)-Math.min(22,v.precipitation*22)-Math.min(21,head*.95)-Math.max(0,v.wind_gusts_10m-20)*.45-(v.temperature_2m<=2?8:0)))}

// Version 1.2: each full commute window is evaluated, including half-hour on return.
function atTime(data,date,time){const times=data?.hourly?.time||[];const ix=times.indexOf(date+'T'+time);return ix<0?null:Object.fromEntries(keys.map(k=>[k,data.hourly[k]?.[ix]]))}
function halfHour(a,b){if(!a)return null;if(!b)return a;const r={};for(const k of keys){if(k==='wind_direction_10m'){const x=Math.sin(a[k]*Math.PI/180)+Math.sin(b[k]*Math.PI/180),y=Math.cos(a[k]*Math.PI/180)+Math.cos(b[k]*Math.PI/180);r[k]=(Math.atan2(x,y)*180/Math.PI+360)%360}else r[k]=(a[k]+b[k])/2}return r}
function windowSamples(data,date,returnTrip){if(!returnTrip)return [atTime(data,date,'04:00'),atTime(data,date,'05:00')].filter(Boolean);return [atTime(data,date,'17:00'),atTime(data,date,'18:00'),halfHour(atTime(data,date,'18:00'),atTime(data,date,'19:00'))].filter(Boolean)}
function windowScore(values,bearing,sunset,returnTrip,date){if(!values.length)return null;let worst=100;for(let i=0;i<values.length;i++){const v=values[i],h=headwind(v.wind_speed_10m,v.wind_direction_10m,bearing);let score=scoreRide(v,h);if(v.precipitation>=1)score=Math.min(score,52);if(v.precipitation>=2.5||v.wind_gusts_10m>=55)score=Math.min(score,24);if(v.wind_gusts_10m>=40)score=Math.min(score,48);if(v.temperature_2m<=0)score-=12;if(returnTrip&&sunset){const end=Date.parse(date+'T'+(i===0?'17:00':i===1?'18:00':'18:30')+':00');const dusk=Date.parse(sunset);if(Number.isFinite(dusk)&&end>dusk)score-=5;}worst=Math.min(worst,Math.max(0,score))}return Math.round(worst)}
function rideMessage(values,score,returnTrip,sunset,date){if(!values?.length||score==null)return '';const wet=values.some(v=>v.precipitation>=.2||v.precipitation_probability>=65),gust=Math.max(...values.map(v=>v.wind_gusts_10m)),cold=Math.min(...values.map(v=>v.temperature_2m)),dark=returnTrip&&sunset&&Date.parse(date+'T18:30:00')>Date.parse(sunset);let parts=[];if(wet)parts.push('Regen auf der Strecke möglich');if(gust>=35)parts.push('kräftige Böen bis '+Math.round(gust)+' km/h');if(cold<=2)parts.push('sehr kalt');if(dark)parts.push('zum Fahrtende bereits dunkel');const verdict=score>=85?'Sehr gute Bedingungen':score>=65?'Gute Fahrt':score>=45?'Ungemütliche Fahrt':score>=25?'Schwierige Bedingungen':'Fahrt nicht empfohlen';return verdict+'. '+(parts.length?parts.join(', ')+'.':'Über die gesamte Fahrtdauer keine größeren Wetterprobleme erkennbar.')}
function verdict12(score){return score>=85?'Sehr gute Fahrt':score>=65?'Gute Fahrt':score>=45?'Ungemütliche Fahrt':score>=25?'Schwierige Bedingungen':'Fahrt nicht empfohlen'}

function displayDate(d){return new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}
function sunTime(value){return typeof value==='string'&&value.includes('T')?value.split('T')[1].slice(0,5):'–'}function colorClass(score){return score>=80?"good":score>=60?"mid":"bad"}function ride(v,hw,label,sunLabel,sunValue){const [title,route]=label.split('|');return `<div class="rideTitle">${title}</div><div class="rideRoute">${route}</div><div class="temp">${Math.round(v.temperature_2m)}°</div><div class="metric"><div><span>${sunLabel}</span><b>${sunTime(sunValue)}</b></div><div><span>Regenrisiko</span><b>${Math.round(v.precipitation_probability)} %</b></div><div><span>Regenmenge</span><b>${Number(v.precipitation).toFixed(1)} mm</b></div><div><span>Wind</span><b>${Math.round(v.wind_speed_10m)} km/h</b></div><div><span>Gegenwind</span><b>${Math.round(hw)} km/h</b></div><div><span>Böen</span><b>${Math.round(v.wind_gusts_10m)} km/h</b></div></div>`}function workDates(){const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const local=new Date(today+'T12:00:00');const weekday=local.getDay();const monday=new Date(local);monday.setDate(local.getDate()-(weekday+6)%7+(weekday===0||weekday===6?7:0));return {today,dates:Array.from({length:5},(_,i)=>{const dt=new Date(monday);dt.setDate(monday.getDate()+i);return dt.toLocaleDateString('sv-SE')})}}
function placeholders(){const {today,dates}=workDates();const previous=days[selected]?.date;days=dates.map(date=>({date,score:null,a:null,b:null,hwA:null,hwB:null}));selected=Math.max(0,days.findIndex(x=>x.date===(previous&&dates.includes(previous)?previous:dates.find(d=>d>=today))));render()}
function render(){const d=days[selected];if(!d)return;document.querySelector('#weekTitle').textContent='Arbeitswoche · Mo–Fr';document.querySelector('#week').innerHTML=days.map((x,i)=>{const available=x.score!==null;return `<button class="day ${i===selected?'active':''}" data-i="${i}" aria-label="${displayDate(x.date)}: ${available?x.score+' Punkte':'Wetterdaten ausstehend'}"><div class="label">${['SO','MO','DI','MI','DO','FR','SA'][new Date(x.date+'T12:00:00').getDay()]}</div><div class="num">${available?x.score:'–'}</div><div class="mini">${x.date.slice(8)}.${x.date.slice(5,7)}.</div><div class="bar"><i class="${available?colorClass(x.score):''}" style="width:${available?x.score:0}%"></i></div></button>`}).join('');document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);render()});document.querySelector('#selectedDate').textContent=displayDate(d.date).toUpperCase();document.querySelector('#heroWeather').innerHTML=`<div><span class="wxLabel">↗ Hin · 04</span><b>${d.a?Math.round(d.a.temperature_2m)+'°':'–'}</b></div><div><span class="wxLabel">↙ Zurück · 17</span><b>${d.b?Math.round(d.b.temperature_2m)+'°':'–'}</b></div><div><span class="wxLabel">≋ Wind hin</span><b>${d.a?Math.round(d.a.wind_speed_10m)+' km/h':'–'}</b></div><div><span class="wxLabel">≋ Wind zurück</span><b>${d.b?Math.round(d.b.wind_speed_10m)+' km/h':'–'}</b></div>`;document.querySelector('#score').textContent=d.score===null?'–':d.score;document.querySelector('#fill').style.width=(d.score===null?0:d.score)+'%';document.querySelector('#fill').className='fill '+(d.score===null?'':colorClass(d.score));document.querySelector('#verdict').textContent=d.score===null?'DATEN NOCH NICHT VERFÜGBAR':verdict12(d.score);document.querySelector('#reason').textContent=d.score===null?'Für diesen Tag liegen derzeit keine Wetterdaten vor.':'Hinfahrt: '+rideMessage(d.outWindow,d.scoreA,false,d.sunset,d.date)+'\n\nRückfahrt: '+rideMessage(d.backWindow,d.scoreB,true,d.sunset,d.date)+'\n\nModelle: '+(d.modelCount?d.modelCount+' von 3 Wettermodellen ausgewertet.':'Noch keine Modellauswertung verfügbar.')+(d.modelCount&&d.spread>=20?' Achtung: Die Modelle weichen deutlich voneinander ab.':'');document.querySelector('#detailsTitle').textContent=displayDate(d.date).replace(/^./,c=>c.toUpperCase());document.querySelector('#out').innerHTML=d.a?ride(d.a,d.hwA,'HINFAHRT · 04:00|MEUSELWITZ → SCHMÖLLN','Sonnenaufgang',d.sunrise)+'<div class="rideAdvice">'+rideMessage(d.outWindow,d.scoreA,false,d.sunset,d.date)+'</div>':'<div class="rideTitle">HINFAHRT · 04:00</div><div class="rideRoute">MEUSELWITZ → SCHMÖLLN</div><div class="temp">–</div><div class="metric">Wetterdaten ausstehend</div>';document.querySelector('#back').innerHTML=d.b?ride(d.b,d.hwB,'RÜCKFAHRT · 17:00|SCHMÖLLN → MEUSELWITZ','Sonnenuntergang',d.sunset)+'<div class="rideAdvice">'+rideMessage(d.backWindow,d.scoreB,true,d.sunset,d.date)+'</div>':'<div class="rideTitle">RÜCKFAHRT · 17:00</div><div class="rideRoute">SCHMÖLLN → MEUSELWITZ</div><div class="temp">–</div><div class="metric">Wetterdaten ausstehend</div>'}
const models=[{id:'icon_d2',name:'DWD ICON-D2'},{id:'ecmwf_ifs025',name:'ECMWF IFS'},{id:'gfs_seamless',name:'GFS'}];
function blend(samples){if(!samples.length)return null;const out={};for(const k of keys){const vals=samples.map(x=>x[k]).filter(Number.isFinite);if(!vals.length)return null;if(k==='wind_direction_10m'){const rad=vals.map(v=>v*Math.PI/180);out[k]=(Math.atan2(rad.reduce((a,v)=>a+Math.sin(v),0),rad.reduce((a,v)=>a+Math.cos(v),0))*180/Math.PI+360)%360}else out[k]=vals.reduce((a,b)=>a+b,0)/vals.length}return out}
async function load(){placeholders();document.querySelector('#verdict').textContent='WETTER WIRD GELADEN';document.querySelector('#reason').classList.remove('error');const selectedDate=days[selected]?.date;
try{const responses=await Promise.all(models.map(async model=>{try{const results=await Promise.all(coords.map(async c=>{const params=new URLSearchParams({latitude:c.lat,longitude:c.lon,hourly:keys.join(','),daily:'sunrise,sunset',timezone:'Europe/Berlin',forecast_days:'16',models:model.id});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+params);if(!r.ok)throw Error(model.name+' nicht erreichbar');return r.json()}));return {model:model.name,data:results}}catch(e){console.warn(model.name,e);return null}}));const usable=responses.filter(Boolean);if(!usable.length)throw Error('Keines der drei Wettermodelle ist erreichbar.');
days=days.map(x=>{const date=x.date;const outByModel=usable.map(m=>windowSamples(m.data[0],date,false));const backByModel=usable.map(m=>windowSamples(m.data[1],date,true));const outWindow=[0,1].map(i=>blend(outByModel.map(v=>v[i]).filter(Boolean))).filter(Boolean);const backWindow=[0,1,2].map(i=>blend(backByModel.map(v=>v[i]).filter(Boolean))).filter(Boolean);const a=outWindow[0],b=backWindow[0];if(!a||!b)return x;const hwA=headwind(a.wind_speed_10m,a.wind_direction_10m,bearingA),hwB=headwind(b.wind_speed_10m,b.wind_direction_10m,bearingB);const sunDaily=usable.map(m=>m.data[0]?.daily).find(v=>v?.time?.includes(date));const sunIndex=sunDaily?sunDaily.time.indexOf(date):-1;const sunrise=sunIndex>=0?sunDaily.sunrise?.[sunIndex]:null;const sunset=sunIndex>=0?sunDaily.sunset?.[sunIndex]:null;const individual=usable.map((m,i)=>{const av=outByModel[i],bv=backByModel[i];if(!av.length||!bv.length)return null;return Math.min(windowScore(av,bearingA,sunset,false,date),windowScore(bv,bearingB,sunset,true,date))}).filter(Number.isFinite);const scoreA=windowScore(outWindow,bearingA,sunset,false,date),scoreB=windowScore(backWindow,bearingB,sunset,true,date);return{date,a,b,hwA,hwB,sunrise,sunset,score:individual.length?Math.round(individual.reduce((a,b)=>a+b,0)/individual.length):Math.min(scoreA,scoreB),scoreA,scoreB,outWindow,backWindow,modelCount:individual.length,spread:individual.length?Math.max(...individual)-Math.min(...individual):0}});
selected=Math.max(0,days.findIndex(x=>x.date===selectedDate));render();const d=days[selected];if(d&&d.score!==null){}if(days.every(d=>d.score===null))throw Error('Für diese Arbeitswoche sind keine Prognosen verfügbar.')
}catch(e){render();document.querySelector('#verdict').textContent='DATEN NICHT VERFÜGBAR';document.querySelector('#reason').textContent=e.message;document.querySelector('#reason').classList.add('error')}}
document.querySelector('#bikeRefresh').onclick=load;placeholders();load();

let displayedWeek=workDates().dates[0];document.addEventListener('visibilitychange',()=>{if(!document.hidden&&workDates().dates[0]!==displayedWeek){displayedWeek=workDates().dates[0];load()}});
</script></body></html>
