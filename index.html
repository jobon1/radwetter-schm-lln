const coords=[{lat:51.043,lon:12.299},{lat:50.897,lon:12.353}];let days=[],selected=0,weekOffset=0,lastSuccessfulUpdate=null,loadSequence=0;
function direction(a,b){const x=(b.lon-a.lon)*Math.cos((a.lat+b.lat)/2*Math.PI/180),y=b.lat-a.lat;return(Math.atan2(x,y)*180/Math.PI+360)%360}

const bearingA=direction(coords[0],coords[1]),bearingB=direction(coords[1],coords[0]);
const keys=['temperature_2m','precipitation_probability','precipitation','wind_speed_10m','wind_direction_10m','wind_gusts_10m','apparent_temperature'];
function sample(data,date,hour){const ix=data.hourly.time.indexOf(date+'T'+hour);if(ix<0)return null;return Object.fromEntries(keys.map(k=>[k,data.hourly[k][ix]]))}
function scoreRide(v,head){if(!v)return 0;return Math.max(0,Math.round(100-Math.min(62,v.precipitation_probability*.67)-Math.min(22,v.precipitation*22)-Math.min(21,head*.95)-Math.max(0,v.wind_gusts_10m-20)*.45-(v.temperature_2m<=2?8:0)))}

// Version 1.2: each full commute window is evaluated, including half-hour on return.
function atTime(data,date,time){const times=data?.hourly?.time||[];const ix=times.indexOf(date+'T'+time);return ix<0?null:Object.fromEntries(keys.map(k=>[k,data.hourly[k]?.[ix]]))}
function halfHour(a,b){if(!a)return null;if(!b)return a;const r={};for(const k of keys){if(k==='wind_direction_10m'){const x=Math.sin(a[k]*Math.PI/180)+Math.sin(b[k]*Math.PI/180),y=Math.cos(a[k]*Math.PI/180)+Math.cos(b[k]*Math.PI/180);r[k]=(Math.atan2(x,y)*180/Math.PI+360)%360}else r[k]=(a[k]+b[k])/2}return r}

function windowScore(values,bearing,sunset,returnTrip,date){if(!values.length)return null;let worst=100;for(let i=0;i<values.length;i++){const v=values[i],h=headwind(v.wind_speed_10m,v.wind_direction_10m,bearing);let score=scoreRide(v,h);if(v.precipitation>=1)score=Math.min(score,52);if(v.precipitation>=2.5||v.wind_gusts_10m>=55)score=Math.min(score,24);if(v.wind_gusts_10m>=40)score=Math.min(score,48);if(v.temperature_2m<=0)score-=12;if(returnTrip&&sunset){const end=Date.parse(date+'T'+(i===0?'17:00':i===1?'18:00':'18:30')+':00');const dusk=Date.parse(sunset);if(Number.isFinite(dusk)&&end>dusk)score-=5;}worst=Math.min(worst,Math.max(0,score))}return Math.round(worst)}

function verdict12(score){return score>=85?'Sehr gute Fahrt':score>=65?'Gute Fahrt':score>=45?'Ungemütliche Fahrt':score>=25?'Schwierige Bedingungen':'Fahrt nicht empfohlen'}

function displayDate(d){return new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}
function windCompass(deg){if(!Number.isFinite(deg))return '–';const names=['N','NO','O','SO','S','SW','W','NW'];return names[Math.round(((deg%360)+360)%360/45)%8]}
function windArrow(deg){if(!Number.isFinite(deg))return '';const arrows=['↓','↙','←','↖','↑','↗','→','↘'];return arrows[Math.round(((deg%360)+360)%360/45)%8]}
function sunTime(value){return typeof value==='string'&&value.includes('T')?value.split('T')[1].slice(0,5):'–'}function colorClass(score){return score>=80?"good":score>=60?"mid":"bad"}function ride(v,hw,label,sunLabel,sunValue){const [title,route]=label.split('|');return `<div class="rideTitle">${title}</div><div class="rideRoute">${route}</div><div class="temp">${Math.round(v.temperature_2m)}°</div><div class="metric"><div><span>Gefühlt</span><b>${Number.isFinite(v.apparent_temperature)?Math.round(v.apparent_temperature)+'°':'–'}</b></div><div><span>${sunLabel}</span><b>${sunTime(sunValue)}</b></div><div><span>Regenrisiko</span><b>${Math.round(v.precipitation_probability)} %</b></div><div><span>Regenmenge</span><b>${Number(v.precipitation).toFixed(1)} mm</b></div><div><span>Wind</span><b>${Math.round(v.wind_speed_10m)} km/h</b></div><div><span>Gegenwind</span><b>${Math.round(hw)} km/h</b></div><div><span>Böen</span><b>${Math.round(v.wind_gusts_10m)} km/h</b></div><div><span>Windrichtung</span><b>${windCompass(v.wind_direction_10m)} <span class="wind-arrow" aria-label="Wind weht in diese Richtung">${windArrow(v.wind_direction_10m)}</span></b></div></div>`}function workDates(){const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const local=new Date(today+'T12:00:00');const weekday=local.getDay();const monday=new Date(local);monday.setDate(local.getDate()-(weekday+6)%7+(weekday===0||weekday===6?7:0)+weekOffset*7);return {today,dates:Array.from({length:5},(_,i)=>{const dt=new Date(monday);dt.setDate(monday.getDate()+i);return dt.toLocaleDateString('sv-SE')})}}
function placeholders(){const {today,dates}=workDates();const previous=days[selected]?.date;days=dates.map(date=>({date,score:null,a:null,b:null,hwA:null,hwB:null}));selected=Math.max(0,days.findIndex(x=>x.date===(previous&&dates.includes(previous)?previous:dates.find(d=>d>=today))));render()}
function render(){const d=days[selected];if(!d)return;document.querySelector('#weekTitle').textContent=weekOffset===0?'Arbeitswoche · Mo–Fr':weekOffset===1?'Nächste Arbeitswoche':'Arbeitswoche · '+new Date(days[0].date+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+'–'+new Date(days[4].date+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});document.querySelector('#weekPrev').disabled=weekOffset===0;document.querySelector('#weekNext').disabled=weekOffset>=2;document.querySelector('#week').innerHTML=days.map((x,i)=>{const available=x.score!==null;return `<button class="day ${i===selected?'active':''}" data-i="${i}" aria-label="${displayDate(x.date)}: ${available?x.score+' Punkte':'Wetterdaten ausstehend'}"><div class="label">${['SO','MO','DI','MI','DO','FR','SA'][new Date(x.date+'T12:00:00').getDay()]}</div><div class="num">${available?x.score:'–'}</div><div class="mini">${x.date.slice(8)}.${x.date.slice(5,7)}.</div><div class="bar"><i class="${available?colorClass(x.score):''}" style="width:${available?x.score:0}%"></i></div></button>`}).join('');document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);render()});document.querySelector('#selectedDate').textContent=displayDate(d.date).toUpperCase();document.querySelector('#heroWeather').innerHTML=`<div class="wxGroup"><div class="wxHeading">Temperatur</div><div class="wxValue"><span>Hinfahrt</span><b>${d.a?Math.round(d.a.temperature_2m)+'°':'–'}</b></div><div class="wxValue"><span>Rückfahrt</span><b>${d.b?Math.round(d.b.temperature_2m)+'°':'–'}</b></div></div><div class="wxGroup"><div class="wxHeading">Wind</div><div class="wxValue"><span>Hinfahrt</span><b>${d.a?Math.round(d.a.wind_speed_10m)+' km/h':'–'}</b></div><div class="wxValue"><span>Rückfahrt</span><b>${d.b?Math.round(d.b.wind_speed_10m)+' km/h':'–'}</b></div></div>`;document.querySelector('#score').textContent=d.score===null?'–':d.score;document.querySelector('#fill').style.width=(d.score===null?0:d.score)+'%';document.querySelector('#fill').className='fill '+(d.score===null?'':colorClass(d.score));document.querySelector('#verdict').textContent=d.score===null?'DATEN NOCH NICHT VERFÜGBAR':verdict12(d.score);document.querySelector('#reason').textContent=d.score===null?'Für diesen Tag liegen derzeit keine Wetterdaten vor.':'Hinfahrt: '+rideMessage(d.outWindow,d.scoreA,false,d.sunset,d.date)+'\n\nRückfahrt: '+rideMessage(d.backWindow,d.scoreB,true,d.sunset,d.date);document.querySelector('#modelSummary').textContent=d.score===null?'':'Modelle: '+(d.modelCount?d.modelCount+' von 3 Wettermodellen ausgewertet.':'Noch keine Modellauswertung verfügbar.')+(d.modelCount&&d.spread>=20?'\nAchtung: Die Modelle weichen deutlich voneinander ab.':'');document.querySelector('#detailsTitle').textContent=displayDate(d.date).replace(/^./,c=>c.toUpperCase());document.querySelector('#out').innerHTML=d.a?ride(d.a,d.hwA,'HINFAHRT · 04:00|MEUSELWITZ → SCHMÖLLN','Sonnenaufgang',d.sunrise)+'<div class="rideAdvice">'+rideMessage(d.outWindow,d.scoreA,false,d.sunset,d.date)+'</div>':'<div class="rideTitle">HINFAHRT · 04:00</div><div class="rideRoute">MEUSELWITZ → SCHMÖLLN</div><div class="temp">–</div><div class="metric">Wetterdaten ausstehend</div>';document.querySelector('#back').innerHTML=d.b?ride(d.b,d.hwB,'RÜCKFAHRT · 17:00|SCHMÖLLN → MEUSELWITZ','Sonnenuntergang',d.sunset)+'<div class="rideAdvice">'+rideMessage(d.backWindow,d.scoreB,true,d.sunset,d.date)+'</div>':'<div class="rideTitle">RÜCKFAHRT · 17:00</div><div class="rideRoute">SCHMÖLLN → MEUSELWITZ</div><div class="temp">–</div><div class="metric">Wetterdaten ausstehend</div>'}
const models=[{id:'icon_d2',name:'DWD ICON-D2'},{id:'ecmwf_ifs025',name:'ECMWF IFS'},{id:'gfs_seamless',name:'GFS'}];
function blend(samples){if(!samples.length)return null;const out={};for(const k of keys){const vals=samples.map(x=>x[k]).filter(Number.isFinite);if(!vals.length)return null;if(k==='wind_direction_10m'){const rad=vals.map(v=>v*Math.PI/180);out[k]=(Math.atan2(rad.reduce((a,v)=>a+Math.sin(v),0),rad.reduce((a,v)=>a+Math.cos(v),0))*180/Math.PI+360)%360}else out[k]=vals.reduce((a,b)=>a+b,0)/vals.length}return out}
async function load(){const sequence=++loadSequence;placeholders();document.querySelector('#verdict').textContent='WETTER WIRD GELADEN';document.querySelector('#reason').classList.remove('error');const selectedDate=days[selected]?.date;
try{const responses=await Promise.all(models.map(async model=>{try{const results=await Promise.all(coords.map(async c=>{const params=new URLSearchParams({latitude:c.lat,longitude:c.lon,hourly:keys.join(','),daily:'sunrise,sunset',timezone:'Europe/Berlin',forecast_days:'16',models:model.id});const r=await fetch('https://api.open-meteo.com/v1/forecast?'+params);if(!r.ok)throw Error(model.name+' nicht erreichbar');return r.json()}));return {model:model.name,data:results}}catch(e){console.warn(model.name,e);return null}}));if(sequence!==loadSequence)return;const usable=responses.filter(Boolean);if(!usable.length)throw Error('Keines der drei Wettermodelle ist erreichbar.');
days=days.map(x=>{const date=x.date;const outByModel=usable.map(m=>windowSamples(m.data[0],date,false));const backByModel=usable.map(m=>windowSamples(m.data[1],date,true));const outWindow=[0,1].map(i=>blend(outByModel.map(v=>v[i]).filter(Boolean))).filter(Boolean);const backWindow=[0,1,2].map(i=>blend(backByModel.map(v=>v[i]).filter(Boolean))).filter(Boolean);const a=outWindow[0],b=backWindow[0];if(!a||!b)return x;const hwA=headwind(a.wind_speed_10m,a.wind_direction_10m,bearingA),hwB=headwind(b.wind_speed_10m,b.wind_direction_10m,bearingB);const sunDaily=usable.map(m=>m.data[0]?.daily).find(v=>v?.time?.includes(date));const sunIndex=sunDaily?sunDaily.time.indexOf(date):-1;const sunrise=sunIndex>=0?sunDaily.sunrise?.[sunIndex]:null;const sunset=sunIndex>=0?sunDaily.sunset?.[sunIndex]:null;const individual=usable.map((m,i)=>{const av=outByModel[i],bv=backByModel[i];if(!av.length||!bv.length)return null;return Math.min(windowScore(av,bearingA,sunset,false,date),windowScore(bv,bearingB,sunset,true,date))}).filter(Number.isFinite);const scoreA=windowScore(outWindow,bearingA,sunset,false,date),scoreB=windowScore(backWindow,bearingB,sunset,true,date);return{date,a,b,hwA,hwB,sunrise,sunset,score:individual.length?Math.round(individual.reduce((a,b)=>a+b,0)/individual.length):Math.min(scoreA,scoreB),scoreA,scoreB,outWindow,backWindow,modelCount:individual.length,spread:individual.length?Math.max(...individual)-Math.min(...individual):0}});
selected=Math.max(0,days.findIndex(x=>x.date===selectedDate));render();const d=days[selected];if(d&&d.score!==null){}if(days.every(d=>d.score===null))throw Error('Für diese Arbeitswoche sind keine Prognosen verfügbar.');lastSuccessfulUpdate=new Date();document.querySelector('#updatedAt').textContent='Letzte Aktualisierung: '+new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(lastSuccessfulUpdate)+' Uhr'
}catch(e){if(sequence!==loadSequence)return;render();document.querySelector('#verdict').textContent='DATEN NICHT VERFÜGBAR';document.querySelector('#reason').textContent=e.message;document.querySelector('#reason').classList.add('error')}}
function changeWeek(delta){const next=weekOffset+delta;if(next<0||next>2)return;weekOffset=next;load()}
document.querySelector('#weekPrev').onclick=()=>changeWeek(-1);
document.querySelector('#weekNext').onclick=()=>changeWeek(1);
const weekStrip=document.querySelector('#week');let swipeStart=null;
weekStrip.addEventListener('touchstart',e=>{if(e.touches.length===1)swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
weekStrip.addEventListener('touchend',e=>{if(!swipeStart)return;const dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4)changeWeek(dx<0?1:-1)},{passive:true});
function shareSummary(){const d=days[selected];if(!d||d.score===null)return 'Radwetter: Für den ausgewählten Tag liegen derzeit keine Wetterdaten vor.';const line=(name,v,score,values,returnTrip)=>name+': '+(v?Math.round(v.temperature_2m)+'°, Wind '+Math.round(v.wind_speed_10m)+' km/h, Böen '+Math.round(v.wind_gusts_10m)+' km/h. ':'')+rideMessage(values,score,returnTrip,d.sunset,d.date);return 'Radwetter · '+displayDate(d.date)+'\n'+verdict12(d.score)+' ('+d.score+'/100)\n\n'+line('Hinfahrt 04:00',d.a,d.scoreA,d.outWindow,false)+'\n\n'+line('Rückfahrt 17:00',d.b,d.scoreB,d.backWindow,true)+'\n\nWetterprognose, keine Garantie.'}
// Version 1.3.6: create a standalone graphic of the selected day, no external libraries.
function makeWeatherCard(d){
 const W=900,H=1370,scale=2,canvas=document.createElement('canvas');
 canvas.width=W*scale;canvas.height=H*scale;
 const c=canvas.getContext('2d');c.scale(scale,scale);
 const ivory='#f1efe9',white='#ffffff',muted='#bdbec2',dark='#101114',panel='#1d1f23',tile='#292b30';
 function rect(x,y,w,h,r,fill){c.fillStyle=fill;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
 function label(t,x,y,size=22,color=white,weight=500,align='left'){
  c.font=weight+' '+size+'px -apple-system, BlinkMacSystemFont, Arial, sans-serif';c.fillStyle=color;c.textAlign=align;c.fillText(t,x,y);c.textAlign='left';
 }
 function lines(t,x,y,maxWidth,lineHeight,size=19,color=muted,weight=400,maxLines=5){
  c.font=weight+' '+size+'px -apple-system, BlinkMacSystemFont, Arial, sans-serif';
  const words=String(t||'').split(/\s+/);let line='',count=0;
  c.fillStyle=color;
  for(const word of words){const next=line?line+' '+word:word;if(c.measureText(next).width>maxWidth&&line){c.fillText(line,x,y+count*lineHeight);count++;line=word;if(count>=maxLines)return;}else line=next}
  if(line)c.fillText(line,x,y+count*lineHeight);
 }
 c.fillStyle=dark;c.fillRect(0,0,W,H);
 label('RADWETTER',45,66,24,muted,800);
 label('Deine Fahrradwoche',45,105,31,white,750);
 rect(36,135,828,370,30,ivory);
 label(displayDate(d.date).toUpperCase(),65,182,21,'#555962',700);
 label(verdict12(d.score),65,242,33,'#151619',800);
 label(d.score+' / 100',826,242,42,'#151619',850,'right');
 rect(65,263,770,10,5,'#c4c4c4');rect(65,263,770*d.score/100,10,5,d.score>=80?'#48a876':d.score>=60?'#d8a43e':'#d66b71');
 label('TEMPERATUR',65,325,19,'#555962',750);label('WIND',473,325,19,'#555962',750);
 for(const [i,name,v] of [[0,'Hinfahrt',d.a],[1,'Rückfahrt',d.b]]){
  const y=365+i*49;label(name,65,y,22,'#555962',500);label(v?Math.round(v.temperature_2m)+'°':'–',410,y,26,'#151619',800,'right');
  label(name,473,y,22,'#555962',500);label(v?Math.round(v.wind_speed_10m)+' km/h':'–',832,y,25,'#151619',800,'right');
 }
 label('WETTER FÜR DEN GEWÄHLTEN TAG',45,560,22,white,800);
 const cards=[{x:36,v:d.a,hw:d.hwA,title:'HINFAHRT · 04:00',route:'MEUSELWITZ → SCHMÖLLN',sun:'Sonnenaufgang',sunval:d.sunrise,window:d.outWindow,score:d.scoreA,ret:false},
 {x:457,v:d.b,hw:d.hwB,title:'RÜCKFAHRT · 17:00',route:'SCHMÖLLN → MEUSELWITZ',sun:'Sonnenuntergang',sunval:d.sunset,window:d.backWindow,score:d.scoreB,ret:true}];
 rect(36,580,828,688,25,panel);
 for(const a of cards){
  const x=a.x+12;rect(x,598,394,650,19,tile);rect(x,598,5,650,2,a.ret?'#d5aa4b':'#48c786');
  label(a.title,x+22,636,19,white,800);label(a.route,x+22,670,16,muted,500);
  label(a.v?Math.round(a.v.temperature_2m)+'°':'–',x+22,755,61,white,850);
  const v=a.v;const values=[
   ['Gefühlt',v?Math.round(v.apparent_temperature)+'°':'–'],[a.sun,sunTime(a.sunval)],
   ['Regenrisiko',v?Math.round(v.precipitation_probability)+' %':'–'],
   ['Regenmenge',v?Number(v.precipitation).toFixed(1)+' mm':'–'],
   ['Wind',v?Math.round(v.wind_speed_10m)+' km/h':'–'],
   ['Gegenwind',v?Math.round(a.hw)+' km/h':'–'],
   ['Böen',v?Math.round(v.wind_gusts_10m)+' km/h':'–'],
   ['Windrichtung',v?windCompass(v.wind_direction_10m)+' '+windArrow(v.wind_direction_10m):'–']
  ];
  values.forEach(([key,val],i)=>{const yy=804+i*42;c.strokeStyle='#424449';c.beginPath();c.moveTo(x+22,yy-25);c.lineTo(x+372,yy-25);c.stroke();label(key,x+22,yy,18,muted);label(val,x+370,yy,19,white,750,'right')});
  lines(rideMessage(a.window,a.score,a.ret,d.sunset,d.date),x+22,1158,350,25,17,muted,400,3);
 }
 label('Modelle: '+(d.modelCount||0)+' von 3 Wettermodellen ausgewertet',45,1310,18,muted);
 label('Radwetter · Prognose ohne Gewähr',45,1345,16,muted);
 return canvas;
}
async function shareWeatherImage(){
 const d=days[selected];if(!d||d.score===null){alert('Für diesen Tag sind noch keine Wetterdaten zum Teilen vorhanden.');return}
 const button=document.querySelector('#shareWeather');button.disabled=true;
 try{
  const canvas=makeWeatherCard(d);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)throw Error('PNG konnte nicht erstellt werden');
  const file=new File([blob],'Radwetter_'+d.date+'.png',{type:'image/png'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file],title:'Radwetter · '+displayDate(d.date)});return}
   catch(e){if(e.name==='AbortError')return;console.warn('Bild teilen nicht möglich',e)}
  }
  // Fallback: save the exact same PNG to Photos/Files and share it manually.
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=file.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  alert('Die Wetterkarte wurde als PNG zum Speichern bereitgestellt. Du kannst das Bild anschließend über Fotos oder Dateien teilen.');
 }catch(e){console.error(e);alert('Die Wetterkarte konnte leider nicht als Bild erstellt werden.')}finally{button.disabled=false}
}
document.querySelector('#shareWeather').onclick=shareWeatherImage;
document.querySelector('#bikeRefresh').onclick=load;placeholders();load();

let displayedWeek=workDates().dates[0];document.addEventListener('visibilitychange',()=>{if(!document.hidden&&workDates().dates[0]!==displayedWeek){displayedWeek=workDates().dates[0];weekOffset=0;load()}});
